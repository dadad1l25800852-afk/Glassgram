name: Build YouFree APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Go tests and race detection
        run: cd backend && go test -race ./...
  android-apk:
    runs-on: ubuntu-24.04
    needs: backend-tests
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner SDK manager
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -r | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download trusted native Xray Android AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download v26.11.9 -R XTLS/libXray -p 'libxray-android.zip' -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/libxray-android"
          unzip -q "$RUNNER_TEMP/libxray-android.zip" -d "$RUNNER_TEMP/libxray-android"
          AAR_PATH="$(find "$RUNNER_TEMP/libxray-android" -type f -name '*.aar' -print -quit)"
          if [ -z "$AAR_PATH" ]; then
            echo "::error::Official libxray-android.zip does not contain an .aar file"
            find "$RUNNER_TEMP/libxray-android" -maxdepth 3 -type f
            exit 1
          fi
          cp "$AAR_PATH" app/libs/libXray.aar
          sha256sum app/libs/libXray.aar
      - name: Assemble Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PyoufreeAbi=arm64-v8a
      - name: Create named artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YouFree-arm64.apk
          sha256sum YouFree-arm64.apk
          unzip -t YouFree-arm64.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: YouFree-ARM64-APK
          path: YouFree-arm64.apk
          if-no-files-found: error
          retention-days: 14
