name: Build YouFree APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Go tests and race detection
        run: cd backend && go test -race ./...
  android-apk:
    runs-on: ubuntu-24.04
    needs: backend-tests
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download trusted native Xray Android AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download v26.11.9 -R XTLS/libXray -p '*.aar' -D app/libs
          find app/libs -name '*.aar' -maxdepth 1 -print
          test -f app/libs/libXray.aar || (find app/libs -maxdepth 1 -name '*.aar' -type f | grep -q . && mv "$(find app/libs -maxdepth 1 -name '*.aar' -type f | head -n1)" app/libs/libXray.aar)
          sha256sum app/libs/libXray.aar
      - name: Assemble Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Create named artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk YouFree.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YouFree-Android-APK
          path: YouFree.apk
          if-no-files-found: error
          retention-days: 14
