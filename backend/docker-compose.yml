services:
  youfree:
    build: .
    restart: unless-stopped
    ports:
      - "443:8443"
    environment:
      LISTEN_ADDR: ":8443"
      TLS_CERT_FILE: "/certs/fullchain.pem"
      TLS_KEY_FILE: "/certs/privkey.pem"
      YOUFREE_TOKEN: "${YOUFREE_TOKEN:?Set a strong access token}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      SAMPLE_MEDIA_DIR: "/testmedia"
    volumes:
      - ./certs:/certs:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
